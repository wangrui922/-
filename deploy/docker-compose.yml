services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ../runtime/redis:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      APP_ENV: prod
      DATABASE_URL: sqlite:////app/data/coach.db
      STORAGE_DIR: /app/data/storage
      TZ: Asia/Shanghai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ../runtime/data:/app/data
      - ../runtime/backups:/backups
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      APP_ENV: prod
      DATABASE_URL: sqlite:////app/data/coach.db
      STORAGE_DIR: /app/data/storage
      TZ: Asia/Shanghai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ../runtime/data:/app/data
      - ../runtime/backups:/backups
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    # ⚠️ 必须覆盖 healthcheck：worker 与 backend **共用同一个 Dockerfile**，
    # 会继承 backend 的 HEALTHCHECK（打 http://127.0.0.1:8000/api/health）。
    # 但 worker 容器里跑的是 celery、**没有 uvicorn**，那个端口无人监听 →
    # 永久 unhealthy（2026-10-20 实测 FailingStreak=7，容器其实完全正常：
    # celery 已连 redis、7 个 task 注册、ready）。
    # 改成用 celery 自己的 ping——既能判活，又真正验证「worker 能接活」。
    # ⚠️ 必须用 CMD-SHELL：exec 形式（CMD）**不经 shell**，`$HOSTNAME`
    # 不会被展开，目标节点名成了字面量 "celery@$HOSTNAME" →
    # "Error: No nodes replied within time constraint"（2026-10-20 实测）。
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME -t 5 || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3

  web:
    build:
      context: ../student-web
      dockerfile: Dockerfile.production
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

  admin-web:
    build:
      context: ../admin-web
      dockerfile: Dockerfile.production
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
