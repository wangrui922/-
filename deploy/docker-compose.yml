services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ../runtime/redis:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      APP_ENV: prod
      DATABASE_URL: sqlite:////app/data/coach.db
      STORAGE_DIR: /app/data/storage
      TZ: Asia/Shanghai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ../runtime/data:/app/data
      - ../runtime/backups:/backups
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      APP_ENV: prod
      DATABASE_URL: sqlite:////app/data/coach.db
      STORAGE_DIR: /app/data/storage
      TZ: Asia/Shanghai
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ../runtime/data:/app/data
      - ../runtime/backups:/backups
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=1"]

  web:
    build:
      context: ../student-web
      dockerfile: Dockerfile.production
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

  admin-web:
    build:
      context: ../admin-web
      dockerfile: Dockerfile.production
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
