[pytest]
# 测试目录
testpaths = tests
# 自动识别 async 测试（FastAPI 路由多为 async）
asyncio_mode = auto
# 把 backend/ 加入导入路径，使 ``from app...`` 可用
pythonpath = .
# 忽略与依赖库相关的噪音告警
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
addopts = -q --strict-markers -p netguard
# ``allow_external_http``：显式豁免「允许访问外部服务」的用例（默认一律禁止）
# 见 netguard.py —— 守卫测试不得发起真实外部 HTTP 请求（尤其大模型 API）。
markers =
    allow_external_http: 本用例允许发起真实外部 HTTP 请求（需写清原因）
